<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#100c1c" />
  <title>符石迷宮 — 迷你地城</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header class="game-head">
      <div>
        <p class="eyebrow">MINI DUNGEON</p>
        <h1>符石迷宮</h1>
      </div>
      <button id="btn-mute" class="icon-button" type="button" aria-pressed="false" aria-label="關閉音效">♪</button>
    </header>

    <section class="hud" aria-label="冒險狀態">
      <div class="floor-badge">
        <span>地下</span>
        <strong><span id="floor-num">1</span>F</strong>
      </div>
      <div class="health">
        <div class="health-line">
          <span>生命</span>
          <b id="hp">14 / 14</b>
        </div>
        <div class="health-track" role="meter" aria-label="生命值" aria-valuemin="0" aria-valuemax="14" aria-valuenow="14">
          <div id="hp-bar" class="health-bar"></div>
        </div>
      </div>
      <div class="stats" aria-label="能力">
        <span>劍 <b id="atk">2</b></span>
        <span>幣 <b id="gold">0</b></span>
        <span>擊破 <b id="kills">0</b></span>
      </div>
    </section>

    <section class="quest" aria-live="polite">
      <span id="quest-icon" class="quest-icon" aria-hidden="true">◇</span>
      <div>
        <strong id="quest-title">尋找符石</strong>
        <p id="status">在迷霧中找到發光符石，再前往出口。</p>
      </div>
    </section>

    <section class="stage-shell" aria-label="遊戲區">
      <canvas id="stage" aria-label="迷宮地圖；使用方向鍵、WASD、滑動或畫面方向鍵移動"></canvas>

      <div id="overlay" class="overlay" data-show="" role="dialog" aria-modal="true" aria-labelledby="overlay-title" inert>
        <div class="overlay-card">
          <span id="overlay-mark" class="overlay-mark" aria-hidden="true">✦</span>
          <h2 id="overlay-title">冒險結束</h2>
          <p id="overlay-text"></p>
          <button id="btn-restart" class="primary-action" type="button">再闖一次</button>
        </div>
      </div>
    </section>

    <section class="action-row" aria-label="冒險操作">
      <button id="btn-potion" class="potion-button" type="button">
        <span aria-hidden="true">♥</span>
        <span>喝藥水</span>
        <b id="potions">2</b>
      </button>
      <div class="dpad" aria-label="方向控制">
        <button id="t-up" type="button" aria-label="向上">▲</button>
        <button id="t-left" type="button" aria-label="向左">◀</button>
        <button id="t-down" type="button" aria-label="向下">▼</button>
        <button id="t-right" type="button" aria-label="向右">▶</button>
      </div>
    </section>

    <ol id="log" class="event-log" aria-label="最近事件" aria-live="polite"></ol>

    <div class="utility-row">
      <button id="btn-newgame" type="button">換一座迷宮</button>
      <details>
        <summary>怎麼玩</summary>
        <p>找符石、開出口、下到第 3 層。撞敵人就會揮劍；每擊破 3 隻怪物會變強。寶箱可能藏著藥水或古幣。</p>
      </details>
    </div>

    <details class="credits">
      <summary>署名／授權</summary>
      <p>美術：Kenney 1-bit Pack（CC0）。音樂：HydroGene — Perilous Dungeon（CC0）。音效：OpenGameArt RPG Sound Pack（CC0）。</p>
    </details>
  </main>
</body>
</html>
